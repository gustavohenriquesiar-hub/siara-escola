name: "Working with data: pipeline"

on:
  push:
    branches: [main]
    paths:
      - "data_pipeline.py"
      - "sample_orders.json"
      - ".github/workflows/data-pipeline.yml"
  workflow_dispatch:
  schedule:
    # Toda segunda-feira, às 12:30 UTC.
    - cron: "30 12 * * 1"

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Executar o pipeline de dados
        run: python data_pipeline.py --input sample_orders.json --output "$RUNNER_TEMP/data-pipeline"

      - name: Mostrar o resumo no Actions
        run: cat "$RUNNER_TEMP/data-pipeline/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar arquivos gerados por sete dias
        uses: actions/upload-artifact@v7
        with:
          name: data-pipeline-${{ github.run_id }}
          path: ${{ runner.temp }}/data-pipeline/
          if-no-files-found: error
          retention-days: 7
