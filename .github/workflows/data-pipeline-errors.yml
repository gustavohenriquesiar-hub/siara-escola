name: "Working with data: error workflow"

on:
  workflow_run:
    workflows:
      - "Working with data: pipeline"
    types: [completed]

permissions: {}

jobs:
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar o resumo da falha
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            echo "## Falha no pipeline de dados"
            echo ""
            echo "- Branch: $BRANCH"
            echo "- Execução: $RUN_ID"
            echo "- Detalhes: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
